<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MedNotes - База знаний</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Публичный текстовый обменник и заметки">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Загрузка заметок...</div>
  <script>
    window.$docsify = {
      name: 'Med Notes',
      repo: 'https://github.com/fafnir-dragon/med', // Замените на ссылку к вашему репозиторию
      loadSidebar: true, // Включает боковую панель (опционально)
      auto2top: true,    // Прокрутка наверх при переходе по страницам
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Поиск по заметкам',
        noData: 'Ничего не найдено!',
      }
    }
  </script>
  <!-- Docsify и плагин поиска -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
